
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | DocOrganizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>DocOrganizer</h1>
    <p>Create your personal document space.</p>
</header>

<main class="auth-container">
    <section class="panel auth-panel">
        <h2>Create Account</h2>
        <p>Register to organize your documents securely.</p>

        {% for kind, message in get_flashed_messages(with_categories=true) %}
            <div class="message {{ kind }}">{{ message }}</div>
        {% endfor %}

        <form method="POST" action="{{ url_for('register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" maxlength="100" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Minimum 8 characters"
                   minlength="8" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password"
                   name="confirm_password"
                   placeholder="Re-enter your password" required>

            <button type="submit">Register</button>
        </form>

        <p class="auth-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>
    </section>
</main>

<footer>Digital Document Organizer</footer>

</body>
</html>
